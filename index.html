<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake by Mason</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;display:grid;min-height:100vh;place-items:center;background:#0b1c10;color:#e7fee8}
    .card{background:#132a18;border-radius:18px;box-shadow:0 10px 30px #0005;padding:28px;max-width:680px;width:92%}
    h1{margin:0 0 12px;font-size:28px}
    p{opacity:.9;line-height:1.45}
    .btn{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:#2e6b3a;color:#fff;text-decoration:none;font-weight:600}
    .btn:hover{filter:brightness(1.05)}
    .meta{font-size:13px;opacity:.75;margin-top:10px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Snake</h1>
    <p>A small SFML game. Download and run locally.</p>
    <a class="btn" href="./Snake_Windows.zip" download>Download for Windows</a>
    <div class="meta">Tip: Windows SmartScreen may warn on first run. Click “More info” → “Run anyway”.</div>
  </main>
</body>
</html>
